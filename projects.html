	  "description": "",
	  "encoded": "This project investigates the use of <strong>touch dynamics</strong> as a behavioural biometric for continuous user authentication on mobile devices. Using the <strong>Touchalytics dataset</strong> (41 participants, ~7,800 scroll strokes, 30 features per stroke), multiple machine learning models were trained and evaluated — including k-Nearest Neighbours, Support Vector Machine, Random Forest, and Neural Networks.<br><br>The best performing model achieved <strong>79.05% accuracy</strong> with an average False Acceptance Rate of just <strong>0.53%</strong>, demonstrating that touch gesture patterns carry strong identity signals. The project also incorporates <strong>Explainable AI (XAI)</strong> techniques (SHAP, LIME, and Random Forest feature importance) to ensure model decisions are transparent, fair, and trustworthy — aligning with Responsible AI principles for ethical deployment of biometric systems.<br><br>Additional datasets (HMOG and Chimerical/FEyG) were reviewed as part of the literature survey, broadening the scope to multimodal and sensor-fusion based authentication approaches.<br><br><h3>Presentation video</h3><br>\n<div class=\"container\"><iframe src=\"https://www.youtube.com/embed/7wIVLl3BWnE\" frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen class=\"video\"></iframe></div><br><br>",

	  "link": "http://shahadatparvez.com/projects#ess",
	  "description": "",
	//   "encoded": "This project involves the design and simulation of a <strong>Grid-Connected Energy Storage System</strong> using MATLAB/Simulink, covering three distinct but interconnected systems: an EV battery pack, a PV system with battery storage, and a UPS battery storage system — culminating in a fully grid-connected renewable energy system with fault recovery capability.<br><br>The <strong>EV battery pack</strong> was designed to match the BMW iX1's 64.7 kWh specification using Lithium-ion 21700 form factor cells (4.8 Ah, 3.7 V). A configuration of 108 cells in series and 38 cells in parallel (4,104 cells total) achieves a nominal 400 V pack voltage with a 90% depth-of-discharge limit for longevity. Simulation verified correct SOC, voltage, and thermal behaviour under charge/discharge cycles including regenerative braking patterns.<br><br>The <strong>PV system with battery storage</strong> was built around a 6 kW array (26 × 240 W STKP-60-250 modules, 2 strings of 13) with a 150 Ah / 400 V lithium-ion battery sized to supply a 5 kW load for 12 hours. A Perturb &amp; Observe MPPT controller drives a DC-DC boost converter to regulate the 400 V DC link, while a single-phase IGBT inverter with LCL filter delivers 230 V AC to the load. Battery charging and discharging were verified across varying load conditions (5–10 kW). A cost analysis estimates the £23,000 installation cost is recouped within 10 years, yielding over £20,000 in savings across a 20-year system lifetime.<br><br>The <strong>UPS battery storage system</strong> was designed to supply a 300 kW critical load seamlessly during grid outage using an online double-conversion topology. A 400 V / 1000 Ah lithium-ion battery (sized for 1 hour at 80% DoD with 95% inverter efficiency) powers a three-phase sinusoidal PWM inverter with LC filter. Grid disconnection at t = 1 s produced no disruption to the load — demonstrating the effectiveness of the online UPS design. Battery technology comparison showed lithium-ion achieved the highest efficiency (~51%) versus lead-acid (~50%) and nickel-cadmium (~50%).<br><br>The <strong>grid-connected PV + storage system</strong> integrates a 160 kW PV array with MPPT, a DC-DC converter, battery storage, and a dual-mode three-phase inverter capable of <em>grid-following</em> (normal operation) and <em>grid-forming</em> (islanded operation) modes. A fault was simulated at t = 0.5 s, triggering breaker isolation; the system seamlessly transitioned to powering the 120 kW critical load from the PV array and battery, with zero reactive power transfer confirmed throughout.<br><br>"		

	"encoded": "This project covers the design and simulation of a <strong>Grid-Connected Energy Storage System</strong> in MATLAB/Simulink across four tasks: an EV battery pack, a PV system with storage, a UPS system, and a fully grid-connected renewable energy system with fault recovery.<br><br>An <strong>EV battery pack</strong> was modelled to match the BMW iX1's 64.7 kWh spec using 21700 lithium-ion cells (108S × 38P, 4,104 cells total), achieving 400 V nominal with a 90% DoD limit. SOC, voltage, and thermal behaviour were verified under charge/discharge and regenerative braking cycles.<br><br>A <strong>6 kW PV system</strong> (26 × 240 W modules) was paired with a 150 Ah battery and a P&amp;O MPPT-controlled boost converter feeding a single-phase inverter with LCL filter. The system was tested across 5–10 kW loads. A cost analysis puts the £23,000 installation cost on track to break even within 10 years, with £20,000+ in savings over 20 years.<br><br>A <strong>300 kW online UPS</strong> using a 400 V / 1000 Ah lithium-ion battery (80% DoD, 95% inverter efficiency) delivered seamless power through a simulated grid outage with no load disruption. Lithium-ion outperformed lead-acid and nickel-cadmium in efficiency comparison.<br><br>Finally, a <strong>160 kW grid-connected PV + storage system</strong> with a dual-mode inverter (grid-following / grid-forming) successfully transitioned to islanded operation at a simulated fault, continuing to supply a 120 kW critical load from PV and battery storage.<br><br>"

      "encoded":  "I was part of the implementation of portable electronic mini weather station was a research project funded by the University Research Center, Shahjalal University of Science and Technology, Sylhet, Bangladesh. In this project a number of weather variables were measured and logged. All the weather variables measured were sent to a server using GSM network where the data could be accessed by any user.<br>The weather variables measured were\n<ul>\n \t<li>Temperature</li>\n \t<li>Humidity</li>\n \t<li>Rainfall [Total rainfall in a day + If it is raining at a particular time or not]</li>\n \t<li>Wind speed</li>\n \t<li>Atmospheric pressure</li>\n \t<li>UV index</li>\n \t<li>Dust density</li>\n \t<li>Ambient light intensity</li>\n \t<li>Different Gas sensing</li>\n</ul>\nI was developed the Wind speed, Atmospheric pressure, UV index, Dust density, Ambient light intensity and Different Gas sensing portion. Additionally I was involved in the system integration of the full system and sending the data to a remote server via GSM network and designing the  website for serving the end user with weather information.<br>&nbsp;<br><h3> Pictures and Videos</h3>   <br><div id=\"img-gallery\"></div>\n<div class=\"container\"><iframe  src=\"https://www.youtube.com/embed/7FD9gLL8Yh4\" frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen class=\"video\"></iframe></div><br><div class=\"container\"><iframe  src=\"https://www.youtube.com/embed/9QimiC-Ekss\" frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen class=\"video\"></iframe></div><br><br><h3>Publications</h3><h4>Journal Paper</h4>\n<ol>\n \t<li><strong>S. H. Parvez</strong>, J. K. Saha, M. J. Hossain, H. Hussain, Md. M. A. Ghuri, T. A. Chowdhury, Md. M. Rahman, N. Z. Shuchi, A. Islam, M. Hasan and B. Paul, “A Novel Design and Implementation of Electronic Weather Station and Weather Data Transmission System Using GSM Network”,WSEAS TRANSACTIONS ON CIRCUITS AND SYSTEMS, 2016\n<a href=\"https://www.researchgate.net/publication/298344488_A_Novel_Design_and_Implementation_of_Electronic_Weather_Station_and_Weather_Data_Transmission_System_Using_GSM_Network\" target=\"_blank\">PDF</a></li>\n</ol>\n<h4>Conference Paper</h4>\n<ol>\n \t<li><strong>S. H. Parvez</strong>, J. K. Saha, M. J. Hossain, H. Hussain, Md. M. A. Ghuri, T. A. Chowdhury, Md. M. Rahman, N. Z. Shuchi, A. Islam, M. Hasan and B. Paul, “Design and Implementation of a Effective, Portable and Scalable Electronic Weather Station”, proc. 14<sup>th</sup> WSEAS Int. Conf. on Instrumentation, Measurement, Circuits and Systems (IMCAS ’15), University of Salerno, Salerno, Italy, June, 2015.\n<a href=\"https://www.researchgate.net/publication/280976055_Design_and_Implementation_of_a_Effective_Portable_and_Scalable_Electronic_Weather_Station?ev=prf_pub\" target=\"_blank\">PDF</a></li>\n</ol><br><h3>The future</h3><br>A larger scale implementation was part of our long term goal but due to lack of funding further work is halted. If you want to fund the further implementation of the project kindly contact me from the contact page in this website.<br>",

    //   "encoded": "We tried to design and implement a user-friendly biomedical device that helps user to monitor and record change in general vital signs like- body temperature, heart rate variability, respiratory rate, blood oxygen saturation, blood pressure and cardiac condition through electrocardiogram. The device uploaded these vital data to a server. Doctor would be able to check these vital information remotely. A part of the project was published <a href=\"https://www.researchgate.net/publication/327908515_Design_and_Implementation_of_a_Compact_Temperature_Heartbeat_and_ECG_Measurement_Module\" rel=\"noopener noreferrer\" target=\"_blank\">Here</a></li>. As time passed publishing the whole project was kept aside for my other work engagement and now it seems unwise to pubish as more sophisticated system has been implemented now.  <div id=\"img-gallery\"></div>",
	"encoded": "This project involved the design and implementation of a <strong>compact, user-friendly biomedical monitoring device</strong> capable of measuring and recording a comprehensive set of vital signs — including <strong>body temperature, heart rate variability, respiratory rate, blood oxygen saturation (SpO₂), blood pressure, and cardiac condition via ECG (Electrocardiogram)</strong>.<br><br>The device was built with accessibility and remote healthcare in mind. Measured vital data was automatically uploaded to a remote server, allowing <strong>doctors and clinicians to monitor patient health remotely</strong> without requiring the patient to be physically present. This made the system particularly suitable for home monitoring, elderly care, and telemedicine applications.<br><br>The hardware integrated multiple sensors into a single compact module, with custom firmware handling signal acquisition, processing, and transmission. Particular attention was given to ECG signal quality and the accuracy of SpO₂ and temperature readings, as these are critical indicators for detecting early signs of deterioration in patient health.<br><br>A portion of this work — focusing on the temperature, heartbeat, and ECG measurement module — was formally published and is available <a href=\"https://www.researchgate.net/publication/327908515_Design_and_Implementation_of_a_Compact_Temperature_Heartbeat_and_ECG_Measurement_Module\" rel=\"noopener noreferrer\" target=\"_blank\">here</a>. Full publication of the complete system was deferred due to other commitments, and given the rapid advancement of commercial biomedical devices since, a full paper was ultimately set aside.<br><br><div id=\"img-gallery\"></div>",

	//   "encoded": "The project was my thesis topic. The main goal of the project was to implement a single phase AC to DC converter with improved power quality. n this project, the performance parameters of ĆUK converter has been analyzed from both  simulation  and  implementation  aspect  for  both  AC-DC  conversion  and  DC-DC conversion by varying different parameters of the converter. Practical implementation was done for ĆUK converter. A principle focus for designing the ĆUK converter was to  take  in  consideration  the  power  quality  parameters  of  the  converter  namely Efficiency, Total Harmonic Distortion and Power Factor. Parameter variation data are represented in the article. Finally a set of parameter values have been found for which the power quality of the ĆUK converter is reasonably good.<br><br>",
	"encoded": "This project was my undergraduate thesis, focused on the <strong>analysis and implementation of a Ćuk topology-based single-phase AC-to-DC converter with improved power quality</strong>.<br><br>The Ćuk converter was studied from both simulation and practical implementation perspectives, covering AC-DC and DC-DC conversion modes. Key power quality parameters — <strong>Efficiency, Total Harmonic Distortion (THD), and Power Factor</strong> — were the primary focus throughout the design process. A systematic parameter variation study was conducted to understand how changes in converter parameters affect these metrics, with results documented and analysed in detail.<br><br>A practical hardware prototype of the Ćuk converter was built and tested, with measured results compared against simulation to validate the design. Through this analysis, an optimal set of parameter values was identified that yields a well-balanced combination of high efficiency, low THD, and near-unity power factor — meeting the criteria for a high power quality AC-DC conversion stage.<br><br>The full analysis and findings from this project have been published and are available to read <a href=\"https://www.researchgate.net/publication/312333116_Analysis_and_Implementation_of_Cuk_Topology_Based_Improved_Power_Quality_Single_Phase_AC_to_DC_Converter\" rel=\"noopener noreferrer\" target=\"_blank\">here</a>.<br><br>"

	  "code":"lifi",
      "title": "Low cost data transmission system via LED lighting with over 50 Bps speed",
      "link": "http://shahadatparvez.com/projects#lifi",
      "description": "",
      "encoded": "Low cost data transmission system via LED lighting with over 50 Bps speed was a small collaboration project with my friend <a href=\"http://tahmidhassan.com\">Tahmid</a>. In this project we tried to implement a communication system with light as medium. LED panels were used as light source and the panel was modulated. The frequency of modulation was chosen such that for naked eye the panel will seem to be constantly on. So communication can be done in parallel with the lights serving their purpose of lighting an area.<br>The data transfer is done between two nodes: a transmitter and a receiver. For transmission large LED panel light was used, which was driven using mosfet with adequate power handling capability. For transmission the LED panel was modulated using Pulse Width Modulation technique. For bit 1 a duty cycle and for bit 0 a different duty cycle was used and in both the case the frequency remained same. To make the LED panel more useful the LED panel was kept on the whole time, so for data transmission the waveform used was slightly aberrant. The wave started with initially being low and then going high . To speed up the data transmission the panel was modulated for one complete cycle only. And on the receiving side PIN photodiode was used in reverse biased stage. The current was allowed to flow through a resistor which allowed for a voltage drop to be measured. The PIN diode used in the project was BPW34. The BPW34 is a very high speed and highly sensitive PIN photodiode in a small flat plastic package. Its top view construction makes it ideal as a low cost replacement of TO-5 devices in a lot of applications. Because of its water-clear epoxy the device is sensitive to visible and infrared radiation. The large active area gives the photo detector a high sensitivity at a wide viewing angle. This is ideal as a receiver because it has a rise time and a fall time of 100 ns each which is good enough for detecting high frequency light pulses making it a perfect candidate to be used as a receiver.<br><br><img src=\"shpnew/projectImages/lifi.jpg\" alt=\"lifi\" width=\"960\" height=\"720\" /> Prototype of the system\n<h3>Conference Paper</h3>\n<ol>\n \t<li>T.H. Talukdar, <strong>S. H. Parvez</strong>, “Small Scale Data Transmission via Light Using Light Source,” in International Conference on Engineering, Research, Innovation and Education, Sylhet, Bangladesh, Jan 2017. <a class=\"pdflinks\" href=\"https://www.researchgate.net/publication/312332806_Small_Scale_Wireless_Data_Transmission_via_Light_Using_Light_Source\" target=\"_blank\"><strong>PDF</strong></a></li>\n</ol>\n",

      "encoded": "The name <strong>\"The Pioneer\"</strong> is well deserved — this was literally the first microcontroller-based project ever built at our university.<br><br>It was early 2012, and we were second-year EEE students at SUST when an invitation for a project competition reached our department. Our teacher wanted the second-year students to take part — a bold ask, considering none of us had ever heard of a microcontroller at that point. While microcontrollers were commonplace globally, they were far from common in Bangladesh, or at least in Sylhet at the time.<br><br>Inspired and encouraged by our teacher, <a href=\"http://www.msahadat.com/\">Mr. Nazmus Sahadat</a>, a group of three — myself, <a href=\"http://www.tahmidhassan.com\">Tahmid</a>, and Jitu — formed a team and set out to learn microcontroller programming from scratch to get the job done. This was no small feat: Arduino didn't exist in our hands back then, so we had to learn bare-metal <strong>AVR programming</strong> from the ground up. The project would simply not have been possible without the continuous guidance and support of Mr. <a href=\"http://www.msahadat.com/\">Nazmus Sahadat</a>, who helped us at every step of the way.<br><br>This Remote Controlled Robotic Car turned out to be just the beginning of a long journey in robotics. It sparked a lasting interest that led to the development of many more robotic cars over the years — including <strong>Bluetooth-controlled vehicles, line followers, light followers, and obstacle-avoiding robots</strong> — each progressively more sophisticated than the last. Later builds combined many of these features together, allowing the robots to intelligently select and follow paths based on environmental inputs.<br><br>That accumulated experience eventually led to the creation of <a href=\"https://github.com/shparvez001/DiffDrive\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>DiffDrive</strong></a> — an open-source Arduino library for controlling the movement of differential drive robots, abstracting away the low-level motor control logic to make it easier to build and program wheeled robots.<br><br><h3>Pictures</h3><div id=\"img-gallery\"></div><br><h3>Video</h3><div class=\"container\"><iframe src=\"https://www.youtube.com/embed/GCdgxC3aXqM\" frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen class=\"video\"></iframe></div>",

      "description": "",
      "encoded": "This project is an <strong>Arduino-based logic gate IC tester</strong> designed to automatically identify and verify common <strong>7400-series logic ICs</strong> — specifically the full set of two-input gates: AND, OR, XOR, NAND, NOR, and XNOR.<br><br>The tester works by applying a sequence of known logic levels to the IC under test via two output pins, then reading the resulting output and comparing it against the expected truth table for each gate type. By systematically stepping through all four input combinations (00, 01, 10, 11) and observing the responses, the firmware narrows down the gate type through a decision-tree approach — no manual selection required.<br><br>Once the IC is identified, the result is displayed on a <strong>16×2 LCD screen</strong>, showing the detected gate type clearly. The entire identification process runs automatically in a continuous loop, making it quick to test multiple ICs in succession.<br><br>The project provides a practical and low-cost alternative to benchtop logic analysers for verifying discrete gate ICs — useful for debugging, salvaging components from old boards, or confirming correct IC insertion during prototyping.<br><br><div id=\"img-gallery\"></div>",

      "description": "",
      "encoded": "This project involved the design and implementation of a <strong>microcontroller-based home automation system</strong> built around the <strong>ATmega328P</strong>, integrating multiple smart control subsystems into a unified embedded platform.<br><br>The system combines a <strong>PIR motion sensor</strong> for presence detection, two independent <strong>relay-controlled output channels</strong> (SW1 and SW2) for switching mains-connected devices such as lights or appliances, and a <strong>DS1307 real-time clock (RTC)</strong> module for time-aware automation — enabling scheduled control of devices based on time of day. A <strong>16×2 LCD display</strong> (LM016L) provides a local user interface for real-time status feedback, and the system runs on a regulated supply with a 3V battery backup for the RTC to retain time during power outages.<br><br>The motion sensor triggers the relay outputs automatically when presence is detected, forming the basis of an <strong>occupancy-based lighting control</strong> system — turning lights on when a room is occupied and off after a set idle period. The dual relay design allows independent control of two separate circuits, making it flexible for a range of automation scenarios beyond just lighting.<br><br>This was one of several home automation projects developed, including a <strong>standalone motion-activated light controller</strong> and an <strong>automatic doorbell system</strong>, as well as more complex multi-subsystem builds like this one that combine sensing, switching, scheduling, and display into a single cohesive unit. Across these projects, the focus was consistently on practical, reliable design that could be deployed in a real home environment.<br><br><div id=\"img-gallery\"></div>",

      "description": "",
      "encoded": "This project involved the design and implementation of a <strong>cell phone controlled mini car</strong> using <strong>DTMF (Dual-Tone Multi-Frequency)</strong> technology — the same signalling standard used by telephone keypads — to wirelessly control the vehicle's movement over a standard phone call.<br><br>The system works by establishing a phone call between a controller handset and a mobile phone mounted on the car. When a key is pressed on the controller's keypad, the corresponding DTMF tone is transmitted over the call and decoded in real time by a <strong>DTMF decoder IC</strong> on the receiver end. The decoded signal is then interpreted by a microcontroller, which drives the motor driver circuit to move the car in the corresponding direction — forward, backward, left, or right.<br><br>One of the key advantages of this approach is its <strong>unlimited control range</strong> — since the command signal travels over the cellular network rather than a dedicated RF link, the car can in principle be controlled from anywhere in the world as long as both phones have network coverage. This makes it fundamentally different from conventional IR or RF remote-controlled vehicles which are limited to line-of-sight or short range.<br><br>The hardware consisted of a motor driver for the DC drive motors, a DTMF decoder module, a microcontroller for interpreting decoded signals, and a chassis with wheels. The project demonstrated a creative and practical application of existing telecommunications infrastructure for real-time remote control.<br><br><div id=\"img-gallery\"></div>",

	  "code":"energy-meter",
      "title": "Implementing Voltmeter, Ammeter and Watt-meter using micro-controllerEnergy Meter",
      "link": "http://shahadatparvez.com/projects#energy-meter",
      "description": "",
      "encoded": "This project involved the design and implementation of a <strong>microcontroller-based multi-function electrical measurement system</strong> capable of simultaneously functioning as a <strong>Voltmeter, Ammeter, and Wattmeter</strong> — three of the most fundamental instruments in electrical engineering — in a single compact device.<br><br>The system measures <strong>AC/DC voltage</strong> and <strong>current</strong> in real time using appropriate signal conditioning circuits. Voltage sensing is achieved through a precision voltage divider network that scales the input voltage down to the ADC-safe range of the microcontroller, while current sensing is implemented using a shunt resistor or current transformer depending on the magnitude of the current being measured. The microcontroller's built-in ADC samples these conditioned signals continuously.<br><br>For the <strong>Wattmeter</strong> functionality, instantaneous power is computed by multiplying the sampled voltage and current values at each time step — reflecting the fundamental definition of electrical power (P = V × I). For AC measurements, the system calculates <strong>true RMS voltage and current</strong> and derives <strong>real power, apparent power, and power factor</strong>, giving a complete picture of the load's electrical behaviour.<br><br>All measured values are displayed in real time on an <strong>LCD screen</strong>, clearly labelled with units (V, A, W) for straightforward readability. The device is calibrated against known reference values to ensure measurement accuracy across its operating range.<br><br>Beyond being a practical bench instrument, this project served as a strong exercise in <strong>analog signal conditioning, ADC interfacing, fixed-point arithmetic for embedded systems, and real-time display management</strong> — skills that underpin a wide range of embedded measurement applications.<br><br>This work also fed directly into a separate but related <strong>smart metering project</strong>, where the goal was to retrofit intelligence onto traditional digital electricity meters without any hardware modification to the meter itself. This was achieved by mounting an <strong>external light sensor</strong> on the meter's pulse LED — a standard feature on most digital energy meters that blinks at a fixed rate proportional to energy consumption. By counting these optical pulses, the system could accurately calculate real-time energy usage. This data was then transmitted to a remote <strong>server over a network connection</strong>, enabling automated smart billing without requiring meter replacement — a cost-effective and non-invasive approach to modernising legacy metering infrastructure.<br><br><div id=\"img-gallery\"></div>",
	  "galleryImages":[
	  ]

      "description": "",
      "encoded": "This project involved the design and implementation of a <strong>microcontroller-based digital clock</strong> with integrated <strong>stopwatch and countdown timer</strong> functionality — combining three time-keeping modes into a single embedded system. Over time, this evolved into multiple versions with different display technologies and connectivity features.<br><br>At its core, the system uses a microcontroller to maintain accurate timekeeping, either by leveraging an external <strong>Real-Time Clock (RTC) module</strong> (such as the DS1307) for battery-backed time retention, or using the microcontroller's internal timer interrupts to count elapsed time with high precision. Several display variants were built across different iterations — including <strong>seven-segment displays, 16×2 LCD screens, and compact OLED panels</strong> — each offering a different balance of readability, power consumption, and form factor.<br><br>The <strong>stopwatch mode</strong> allows the user to measure elapsed time with start, stop, and reset controls — useful for timing events with precision down to milliseconds. The system captures the start time on button press and continuously updates the display with the elapsed duration, maintaining accuracy through interrupt-driven timing rather than polling, which avoids drift caused by instruction execution delays.<br><br>The <strong>countdown timer mode</strong> allows the user to set a target duration using input buttons, after which the system counts down to zero and triggers an alert — typically a buzzer or LED indicator — upon completion. This makes it suitable for practical applications such as kitchen timers, lab experiment timing, or process control.<br><br>A later version extended the design with <strong>Wi-Fi connectivity</strong>, replacing the RTC module with an <strong>NTP (Network Time Protocol)</strong> client that automatically synchronises the current time from the internet on startup. This eliminated the need for manual time setting and ensured the clock always displayed accurate time regardless of power interruptions — a significant improvement in usability for always-connected environments.<br><br>Mode switching between clock, stopwatch, and timer is handled through dedicated push buttons, with the current mode and relevant values always reflected on the display. Across all versions, the design emphasises <strong>interrupt-driven architecture, debounced button handling, and efficient display interfacing</strong> — making it a comprehensive and progressively refined exercise in real-time embedded systems design.<br><br><div id=\"img-gallery\"></div>",
